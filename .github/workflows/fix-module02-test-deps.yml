name: Fix Module 02 test dependency lock

on:
  push:
    branches:
      - release/module-02-verified-v2
    paths:
      - ".module02-deps-trigger"
      - ".github/workflows/fix-module02-test-deps.yml"

permissions:
  contents: write

jobs:
  add-test-dependency:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:5432/ci_test
    steps:
      - name: Check out the release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Add the missing SQLite async test driver
        run: uv add --group dev "aiosqlite>=0.21.0"
      - name: Verify locked environment and full suite
        run: |
          uv sync --locked --all-groups --all-extras
          uv run --no-sync pytest -q --tb=short
          git diff --check
      - name: Commit the dependency and lockfile
        shell: bash
        run: |
          set -euo pipefail
          rm -f .module02-deps-trigger .github/workflows/fix-module02-test-deps.yml
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only --diff-filter=AM | wc -l)" -eq 2
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: add aiosqlite to locked development dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
