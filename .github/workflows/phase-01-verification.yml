name: Phase 01 verification

on:
  push:
    branches:
      - feature/admin-system-delivery
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ehteraf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ehteraf_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ehteraf_test
      SECRET_KEY: ci-only-secret-key-not-for-production-0000000000000000
      TELEGRAM_MODE: webhook
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q backend database tests
      - name: Run test suite
        run: pytest -q --tb=short
